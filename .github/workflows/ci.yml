name: CI

on:
  pull_request:
    branches: [main]

# Let a new push cancel in-flight runs on the same PR — we only care
# about the latest revision.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  impl:
    name: impl tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Install tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux
          tmux -V

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  conformance:
    name: conformance kit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Install tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux
          tmux -V

      - name: Build reference tpctl
        run: go build -o tpctl ./cmd/tpctl

      - name: Run conformance kit
        working-directory: conformance
        run: |
          go test ./scenarios/ \
            -parallel=4 \
            -timeout=5m \
            -args --binary="${GITHUB_WORKSPACE}/tpctl"
